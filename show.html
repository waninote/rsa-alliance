<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSA - QR表示</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B1A;
    --pink: #E8317A;
    --purple: #7B2FBE;
    --deep: #0D0618;
    --white: #F5F0FF;
    --muted: rgba(245,240,255,0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgba(123,47,190,.3) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 20% 80%, rgba(232,49,122,.15) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 80% 20%, rgba(255,107,26,.12) 0%, transparent 60%);
  }

  .logo-wrap {
    width: 56px; height: 56px;
    margin-bottom: 1.2rem;
    animation: float 4s ease-in-out infinite;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .brand {
    font-family: 'Space Mono', monospace;
    font-size: .75rem;
    letter-spacing: .12em;
    color: var(--orange);
    margin-bottom: .5rem;
  }

  .message {
    font-size: 1.25rem;
    font-weight: 900;
    line-height: 1.6;
    margin-bottom: .5rem;
  }

  .sub {
    font-size: .82rem;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .qr-wrap {
    background: #fff;
    border-radius: 16px;
    padding: 1.2rem;
    display: inline-block;
    box-shadow: 0 8px 40px rgba(232,49,122,.3), 0 0 0 1px rgba(255,107,26,.3);
    margin-bottom: 1.8rem;
  }

  .qr-wrap img {
    width: min(220px, 60vw);
    height: min(220px, 60vw);
    display: block;
  }

  .hint {
    font-size: .78rem;
    color: var(--muted);
    letter-spacing: .08em;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: .4; }
    50% { opacity: 1; }
  }

  .url {
    margin-top: 1.2rem;
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    color: var(--muted);
    word-break: break-all;
  }
</style>
</head>
<body>

  <div class="logo-wrap">
    <img src="logo.png" alt="RSA">
  </div>

  <div class="brand">The Right Staff Alliance</div>

  <div class="message">よかったら、<br>詳しく見てみてください。</div>
  <div class="sub">QRコードを読み取ってください</div>

  <div class="qr-wrap">
    <img src="QR_flyer_to_slide.png" alt="QRコード">
  </div>

  <div class="hint">📷 カメラを向けるだけで読み取れます</div>
  <div class="url">https://waninote.github.io/rsa-alliance/</div>

</body>
</html>
