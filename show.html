<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSA - 仲間集め中</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #FF6B1A;
    --pink: #E8317A;
    --purple: #7B2FBE;
    --deep: #0D0618;
    --white: #F5F0FF;
    --muted: rgba(245,240,255,0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep);
    color: var(--white);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.5rem;
    text-align: center;
    background-image:
      radial-gradient(ellipse 90% 70% at 50% 50%, rgba(123,47,190,.25) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 15% 85%, rgba(232,49,122,.18) 0%, transparent 60%),
      radial-gradient(ellipse 40% 35% at 85% 15%, rgba(255,107,26,.15) 0%, transparent 60%);
  }

  /* 星 */
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1px 1px at 10% 10%, rgba(255,255,255,.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 30%, rgba(255,255,255,.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 50% 8%, rgba(255,255,255,.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 20%, rgba(255,255,255,.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 40%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 8% 60%, rgba(255,255,255,.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 92% 75%, rgba(255,255,255,.9) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 88%, rgba(255,255,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 92%, rgba(255,255,255,.7) 0%, transparent 100%);
  }

  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center;
  }

  .logo-wrap {
    width: 64px; height: 64px;
    margin-bottom: 1.8rem;
    animation: float 4s ease-in-out infinite;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .main-text {
    font-size: clamp(1.8rem, 8vw, 2.6rem);
    font-weight: 900;
    line-height: 1.4;
    margin-bottom: .8rem;
    background: linear-gradient(135deg, var(--white) 0%, rgba(245,240,255,.7) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .main-text span {
    background: linear-gradient(135deg, var(--orange), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sub-text {
    font-size: clamp(.95rem, 4vw, 1.1rem);
    font-weight: 300;
    color: var(--muted);
    margin-bottom: 2.5rem;
    letter-spacing: .05em;
  }

  .qr-wrap {
    background: #fff;
    border-radius: 18px;
    padding: 1.1rem;
    display: inline-block;
    box-shadow:
      0 0 0 1px rgba(255,107,26,.25),
      0 8px 40px rgba(123,47,190,.4),
      0 0 60px rgba(232,49,122,.2);
    margin-bottom: 2rem;
    animation: glow 3s ease-in-out infinite;
  }

  @keyframes glow {
    0%,100% { box-shadow: 0 0 0 1px rgba(255,107,26,.25), 0 8px 40px rgba(123,47,190,.4), 0 0 60px rgba(232,49,122,.2); }
    50%      { box-shadow: 0 0 0 1px rgba(255,107,26,.5),  0 8px 48px rgba(123,47,190,.6), 0 0 80px rgba(232,49,122,.35); }
  }

  .qr-wrap img {
    width: min(200px, 56vw);
    height: min(200px, 56vw);
    display: block;
  }

  .brand {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    letter-spacing: .15em;
    color: var(--muted);
    margin-bottom: .4rem;
  }

  .hint {
    font-size: .8rem;
    color: var(--muted);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
</style>
</head>
<body>
<div class="stars"></div>

<div class="content">
  <div class="logo-wrap">
    <img src="logo.png" alt="The Right Staff Alliance">
  </div>

  <div class="main-text"><span>星々を、</span>集めています。</div>
  <div class="sub-text">力を貸してもらえませんか。</div>

  <div class="qr-wrap">
    <img src="QR_flyer_to_slide.png" alt="QRコード">
  </div>

  <div class="brand">The Right Staff Alliance</div>
  <div class="hint">📷 カメラを向けるだけで読み取れます</div>
</div>

</body>
</html>
